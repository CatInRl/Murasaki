name: Test

# 门禁：PR 与 main 推送时跑单测 / 类型检查 / Rust 测试 / E2E
#
# e2e job 在 windows-latest 上用 tauri-driver + msedgedriver 驱动真实 WebView2，覆盖
# 单测覆盖不到的渲染与原生窗口行为。两个必须注意的点（见 #257）：
#   ① 被测二进制必须用 Tauri CLI 构建 —— 裸 `cargo build --release` 产出的二进制前端
#      起不来（webview 停在 title="localhost"），整套 e2e 会系统性失败；
#   ② 跑之前不能有残留的 tauri-driver / msedgedriver 占用 4444 / 4445，否则 setup 会
#      静默复用一个半死的 driver，所有 session 报 ECONNRESET。
# 目前 e2e 只跑不拦（未加入 required status checks），避免拖慢每个 PR（见 #261）。
#
# Linux e2e（e2e-linux job）用 tauri-driver + WebKitWebDriver（webkit2gtk-driver 包）
# 驱动真实 WebKitGTK，经 Xvfb 无头运行；应用侧 E2E 判定来自 tauri-driver 注入的
# TAURI_WEBVIEW_AUTOMATION 环境变量（见 src-tauri/src/lib.rs 的 is_e2e_mode）。
# 首期不加入 required status checks，稳定后再提升（同 #261 的路径）。
#
# macOS e2e（e2e-macos job）不用 tauri-driver —— 它不支持 WKWebView（safaridriver
# 需 GUI 授权，CI 不可用）。改用应用内嵌的 WebDriver 服务端（tauri-plugin-wdio-webdriver，
# 仅 debug 构建注册，见 lib.rs run()）：应用进程由 e2e/helpers/driver.ts 自行 spawn/kill，
# session 生命周期 = 应用进程生命周期。因此被测二进制必须 `tauri build --debug` ——
# release 二进制没注册插件，/status 永不就绪。首期同样只跑不拦（#368）。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 安装 npm 依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 类型检查与构建
        run: npm run build

  rust:
    name: rust
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 npm 依赖
        run: npm ci

      # tauri.conf.json 的 frontendDist 指向 ../dist，build.rs 需要该目录已存在。
      # 这里显式给出 TAURI_ENV_PLATFORM=windows，使本 job 走与 Windows 生产构建
      # （tauri build）相同的 build.target 分支（chrome105）；否则默认落 safari13，
      # 那条 Windows 专属分支将没有任何 CI 覆盖。
      - name: 构建前端
        run: npm run build
        env:
          TAURI_ENV_PLATFORM: windows

      - name: Rust 测试
        run: npm run test:rust

  e2e:
    name: e2e
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 npm 依赖
        run: npm ci

      - name: 安装 tauri-driver
        run: cargo install tauri-driver --locked

      # 下载与本地 WebView2 Runtime 版本匹配的 msedgedriver，
      # 装到 %USERPROFILE%\.cargo\bin（check-env.mjs 与 setup.ts 的默认查找位置）
      - name: 安装匹配版本的 msedgedriver
        run: powershell -ExecutionPolicy Bypass -File e2e/scripts/install-msedgedriver.ps1

      # 用 Tauri CLI 构建（不能用裸 cargo build，理由见文件头注释 ①）。
      # --no-bundle 跳过打包与 updater 签名产物 —— e2e 只需要可运行的 exe，
      # 而签名需要 TAURI_SIGNING_PRIVATE_KEY，CI 上不应为测试引入该依赖。
      - name: 构建应用
        run: npx tauri build --no-bundle

      # 把 TMP/TEMP 指到 runner.temp：应用侧 e2e_trace 用 std::env::temp_dir()
      # （Windows 下取 TMP/TEMP），默认是 C:\Users\<user>\AppData\Local\Temp，
      # 与下面的 artifact 路径（runner.temp = D:\a\_temp）不一致会导致日志永远收集不到。
      - name: 运行 E2E
        run: npm run test:e2e
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}

      # 失败时留诊断日志：应用侧在 E2E 模式会写 <TEMP>\murasaki-devtools.log
      # （Windows 更新通道 / DevToolsActivePort 写入等排查线索）
      - name: 上传失败诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/murasaki-devtools.log
          if-no-files-found: ignore

  e2e-linux:
    name: e2e (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 系统库清单与 release.yml 的 Linux 构建一致；webkit2gtk-driver 提供
      # tauri-driver 在 Linux 上驱动的 WebKitWebDriver，xvfb 提供无头 X server
      - name: 安装 Linux 系统库与 WebKitWebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            webkit2gtk-driver \
            xvfb

      - name: 安装 npm 依赖
        run: npm ci

      - name: 安装 tauri-driver
        run: cargo install tauri-driver --locked

      # 用 Tauri CLI 构建（不能用裸 cargo build —— 前端起不来，见文件头注释 ①）
      - name: 构建应用
        run: npx tauri build --no-bundle

      # 必须经 Xvfb 跑 GTK/WebKit 应用；-screen 显式给足分辨率，避免 640x480 默认
      # 值引发「元素滚不入视区」一类几何 flake。
      # WEBKIT_DISABLE_DMABUF_RENDERER=1 规避 DMABUF 渲染在部分驱动下的黑屏（官方建议）。
      # TMPDIR 指到 runner.temp：应用侧 e2e_trace 写 temp_dir()/murasaki-devtools.log，
      # Linux 下 temp_dir() 取 TMPDIR，与 artifact 路径保持一致。
      - name: 运行 E2E（Xvfb）
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:e2e
        env:
          TMPDIR: ${{ runner.temp }}
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'

      # 失败时留诊断日志（与 Windows job 同名文件，artifact 名必须不同）
      - name: 上传失败诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-linux
          path: ${{ runner.temp }}/murasaki-devtools.log
          if-no-files-found: ignore

  e2e-macos:
    name: e2e (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 npm 依赖
        run: npm ci

      # 无需安装 tauri-driver / 原生 driver（理由见文件头 macOS 段）。
      # 必须 --debug：内嵌 WebDriver 服务端仅 debug 构建注册。
      # --no-bundle 跳过打包 —— e2e 只需要可运行的裸二进制（driver.ts spawn 它）。
      - name: 构建应用（debug）
        run: npx tauri build --debug --no-bundle

      # macOS runner 自带 GUI session（WindowServer），WKWebView 可直接跑，无需 Xvfb。
      # TMPDIR 指到 runner.temp：应用侧 e2e_trace 写 temp_dir()/murasaki-devtools.log，
      # macOS 下 temp_dir() 取 TMPDIR，与 artifact 路径保持一致。
      - name: 运行 E2E
        run: npm run test:e2e
        env:
          TMPDIR: ${{ runner.temp }}

      # 失败时留诊断日志（artifact 名必须与前两个 e2e job 不同）
      - name: 上传失败诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-macos
          path: ${{ runner.temp }}/murasaki-devtools.log
          if-no-files-found: ignore
