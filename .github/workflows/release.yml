name: Release

# 触发条件：推送 v*.*.* 格式的 tag 时自动构建并发布 Release
on:
  push:
    tags:
      - 'v*.*.*'

  # 支持手动触发（用于测试构建流程）
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write  # 创建 Release 与上传资源所需

jobs:
  # === 创建 Release 草稿 ===
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-upload-url: ${{ steps.create-release.outputs.upload_url }}
      release-id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: 从 CHANGELOG.md 提取本版本变更记录
        id: changelog
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          # 提取 ## [VERSION] 行之后到下一个 ## [ 行之前的所有内容（不含版本标题行）
          # 若找不到该版本则输出空字符串
          CONTENT=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if ($0 ~ "^## \\[" ver "\\]") { in_section=1; next }
              else { in_section=0 }
            }
            in_section { print }
          ' CHANGELOG.md)
          # 写入临时文件，避免多行字符串在 GitHub Actions output 中的转义问题
          echo "$CONTENT" > /tmp/changelog-section.md
          echo "filepath=/tmp/changelog-section.md" >> $GITHUB_OUTPUT
          # 输出预览（前 20 行）便于调试
          echo "=== 提取的 CHANGELOG 内容预览 ==="
          head -n 20 /tmp/changelog-section.md
          echo "================================"

      - name: 生成 Release Notes（安装说明 + CHANGELOG）
        id: notes
        run: |
          # 拼接安装说明 + CHANGELOG 内容，写入单一文件供 body_path 使用
          {
            echo "# Murasaki ${{ steps.vars.outputs.tag }}"
            echo ""
            echo "## 安装"
            echo ""
            echo "### Windows"
            echo "- \`Murasaki_*_x64-setup.exe\` — NSIS 安装包（推荐）"
            echo "- \`Murasaki_*_x64_en-US.msi\` — MSI 安装包"
            echo ""
            echo "### macOS"
            echo "- \`Murasaki_*_aarch64.dmg\` — Apple Silicon"
            echo "- \`Murasaki_*_x64.dmg\` — Intel"
            echo ""
            echo "### Linux"
            echo "- \`Murasaki_*_amd64.deb\` — Debian/Ubuntu"
            echo "- \`Murasaki_*_amd64.AppImage\` — 便携版"
            echo ""
            echo "## 校验"
            echo "下载后请比对 \`*.sig\` 签名文件。"
            echo ""
            echo "---"
            echo ""
            echo "## 变更记录"
            echo ""
            cat "${{ steps.changelog.outputs.filepath }}"
          } > /tmp/release-notes.md
          echo "filepath=/tmp/release-notes.md" >> $GITHUB_OUTPUT
          echo "=== 最终 Release Notes 行数 ==="
          wc -l /tmp/release-notes.md

      - name: 创建 Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Murasaki ${{ steps.vars.outputs.tag }}
          body_path: ${{ steps.notes.outputs.filepath }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # === 多平台构建 ===
  build:
    needs: create-release
    strategy:
      fail-fast: false  # 单个平台失败不影响其他平台
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 macOS 交叉编译 target
        if: matrix.platform == 'macos-latest' && matrix.args != ''
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 安装依赖（Linux 系统库）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: 安装 npm 依赖
        run: npm ci

      - name: 构建并上传 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater 签名密钥对（ADR-0012）
          # 检测到 TAURI_SIGNING_PRIVATE_KEY 时，tauri-action 自动：
          # 1. 对每个构建产物生成 .sig 签名文件
          # 2. 生成 latest.json manifest（含版本号 / 发布说明 / 各平台下载 URL + 签名）
          # 3. 上传 .sig 与 latest.json 到 Release assets
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: ${{ matrix.args }}

  # === 发布完成通知 ===
  finalize:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: 发布完成
        run: |
          echo "✅ Release ${{ needs.create-release.outputs.release-id }} 已发布"
          echo "查看: https://github.com/${{ github.repository }}/releases"
