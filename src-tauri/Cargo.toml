[package]
name = "murasaki"
version = "0.10.1"
description = "A local Markdown file manager and editor"
authors = ["CatInRl"]
edition = "2021"

[lib]
name = "murasaki_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
lexical-sort = "0.3"
pinyin = "0.11"
sha1 = "0.11"
dirs = "6"
regex = "1"
walkdir = "2"
notify = "8"
uuid = { version = "1", features = ["v4"] }
sys-locale = "0.3.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS E2E 专用：内嵌 WebDriver 服务端（tauri-driver 不支持 WKWebView）。
# 仅 debug 构建注册（见 lib.rs run()），release 构建只是多编译不用。
tauri-plugin-wdio-webdriver = "1.4.0"

[dev-dependencies]
tempfile = "3"
