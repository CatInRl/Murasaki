[package]
name = "murasaki"
version = "0.2.0"
description = "A local Markdown file manager and editor"
authors = ["CatInRl"]
edition = "2021"

[lib]
name = "murasaki_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
lexical-sort = "0.3"
pinyin = "0.11"
sha1 = "0.10"
dirs = "5"
regex = "1"
walkdir = "2"
notify = "7"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "1"

[dev-dependencies]
tempfile = "3"
