<!DOCTYPE html>

    <style id="theme-vars">
/* Murasaki Design System - Purple-themed Desktop Markdown Editor */
/* Brand: Murasaki (紫式部) - Light, focused, writing-first */

:root {
  /* Brand Palette - Single primary hue (purple) */
  --murasaki-purple-50: #faf5ff;
  --murasaki-purple-100: #f3e8ff;
  --murasaki-purple-200: #e9d5ff;
  --murasaki-purple-300: #d8b4fe;
  --murasaki-purple-400: #c084fc;
  --murasaki-purple-500: #a855f7;
  --murasaki-purple-600: #9333ea;
  --murasaki-purple-700: #7e22ce;
  --murasaki-purple-800: #6b21a8;
  --murasaki-purple-900: #581c87;

  /* Neutral Palette - Warm gray for editor comfort */
  --murasaki-neutral-50: #fafafa;
  --murasaki-neutral-100: #f5f5f5;
  --murasaki-neutral-200: #e5e5e5;
  --murasaki-neutral-300: #d4d4d4;
  --murasaki-neutral-400: #a3a3a3;
  --murasaki-neutral-500: #737373;
  --murasaki-neutral-600: #525252;
  --murasaki-neutral-700: #404040;
  --murasaki-neutral-800: #262626;
  --murasaki-neutral-900: #171717;
  --murasaki-neutral-950: #0a0a0a;

  /* Semantic Tokens */
  --murasaki-background: #ffffff;
  --murasaki-foreground: #171717;
  --murasaki-card: #fafafa;
  --murasaki-card-foreground: #171717;
  --murasaki-popover: #ffffff;
  --murasaki-popover-foreground: #171717;
  --murasaki-primary: #9333ea;
  --murasaki-primary-foreground: #ffffff;
  --murasaki-muted: #f5f5f5;
  --murasaki-muted-foreground: #737373;
  --murasaki-border: #e5e5e5;
  --murasaki-input: #e5e5e5;
  --murasaki-ring: #c084fc;
  --murasaki-radius-sm: 4px;
  --murasaki-radius-md: 8px;
  --murasaki-radius-lg: 16px;

  /* Surface System */
  --murasaki-surface: #f9fafb;
  --murasaki-surface-2: #f3f4f6;
  --murasaki-ink: #171717;
  --murasaki-ink-2: #525252;
  --murasaki-ink-3: #a3a3a3;
  --murasaki-line: #e5e5e5;

  /* State Colors */
  --murasaki-state-success: #16a34a;
  --murasaki-state-warning: #d97706;
  --murasaki-state-error: #dc2626;
  --murasaki-state-info: #2563eb;
}

/* Typography */
body {
  font-family: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--murasaki-background);
    --color-foreground: var(--murasaki-foreground);
    --color-card: var(--murasaki-card);
    --color-card-foreground: var(--murasaki-card-foreground);
    --color-popover: var(--murasaki-popover);
    --color-popover-foreground: var(--murasaki-popover-foreground);
    --color-primary: var(--murasaki-primary);
    --color-primary-foreground: var(--murasaki-primary-foreground);
    --color-muted: var(--murasaki-muted);
    --color-muted-foreground: var(--murasaki-muted-foreground);
    --color-border: var(--murasaki-border);
    --color-input: var(--murasaki-input);
    --color-ring: var(--murasaki-ring);
    --radius-sm: var(--murasaki-radius-sm);
    --radius-md: var(--murasaki-radius-md);
    --radius-lg: var(--murasaki-radius-lg);
  }
  @layer base {
    body { background: var(--murasaki-background); color: var(--murasaki-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

<body class="min-h-screen font-sans antialiased">

          </a>

        <!-- Right Content -->
        <main id="settings-content">
          <div class="content-inner">

            <!-- 编辑模式 -->

                </div>

                    <span class="switch-track"></span>

              </div>

          </div>
        </main>

    <style id="critical-layout">
      /* === Settings Window Shell === */
      #settings-window {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background: var(--murasaki-background);
        color: var(--murasaki-ink);
      }

      /* === Title Bar === */
      #settings-title-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        height: 44px;
        padding: 0 12px 0 16px;
        background: var(--murasaki-background);
        border-bottom: 1px solid var(--murasaki-line);
        user-select: none;
      }
      .title-left {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--murasaki-ink);
      }
      .title-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: var(--murasaki-radius-sm);
        background: transparent;
        color: var(--murasaki-ink-3);
        cursor: pointer;
        transition: background 120ms, color 120ms;
      }
      .title-close:hover {
        background: var(--murasaki-neutral-200);
        color: var(--murasaki-ink);
      }
      .title-close:active {
        background: var(--murasaki-neutral-300);
      }

      /* === Body Layout === */
      .settings-body {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* === Sidebar === */
      #settings-sidebar {
        width: 200px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        padding: 8px;
        background: var(--murasaki-surface);
        border-right: 1px solid var(--murasaki-line);
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--murasaki-radius-md);
        font-size: 13px;
        color: var(--murasaki-ink-2);
        text-decoration: none;
        transition: background 120ms, color 120ms;
        position: relative;
      }
      .nav-item:hover {
        background: var(--murasaki-neutral-200);
        color: var(--murasaki-ink);
      }
      .nav-item.active {
        background: var(--murasaki-purple-50);
        color: var(--murasaki-primary);
        font-weight: 500;
      }
      .nav-item svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .nav-active-icon {
        margin-left: auto;
        transform: rotate(0deg);
      }

      /* === Content === */
      #settings-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--murasaki-background);
      }
      .content-inner {
        flex: 1;
        overflow-y: auto;
        padding: 24px 32px;
      }
      .content-header {
        margin-bottom: 24px;
      }
      .content-header h1 {
        font-size: 20px;
        font-weight: 600;
        color: var(--murasaki-ink);
        margin: 0 0 4px 0;
        letter-spacing: -0.01em;
      }
      .content-header p {
        margin: 0;
        font-size: 13px;
        color: var(--murasaki-muted-foreground);
      }

      /* === Settings Sections === */
      .setting-section {
        margin-bottom: 28px;
      }
      .setting-section h2 {
        font-size: 13px;
        font-weight: 600;
        color: var(--murasaki-ink-2);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 12px 0;
      }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 14px 0;
        border-bottom: 1px solid var(--murasaki-line);
      }
      .setting-row:first-of-type {
        padding-top: 0;
      }
      .setting-label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .setting-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--murasaki-ink);
      }
      .setting-desc {
        font-size: 12px;
        color: var(--murasaki-muted-foreground);
      }
      .setting-desc code {
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
        font-size: 11px;
        padding: 1px 4px;
        background: var(--murasaki-muted);
        border-radius: var(--murasaki-radius-sm);
        color: var(--murasaki-ink-2);
      }
      .setting-control {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        flex-shrink: 0;
      }
      .setting-caption {
        font-size: 11px;
        color: var(--murasaki-muted-foreground);
      }

      /* === Toggle Switch === */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
        cursor: pointer;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch-track {
        position: absolute;
        inset: 0;
        background: var(--murasaki-neutral-300);
        border-radius: 999px;
        transition: background 120ms;
      }
      .switch-track::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0,0,0,0.12);
        transition: transform 120ms;
      }
      .switch input:checked + .switch-track {
        background: var(--murasaki-primary);
      }
      .switch input:checked + .switch-track::before {
        transform: translateX(18px);
      }
      .switch input:focus-visible + .switch-track {
        box-shadow: 0 0 0 2px var(--murasaki-ring);
      }

      /* === Segmented Control === */
      .segmented-control {
        display: inline-flex;
        padding: 3px;
        background: var(--murasaki-muted);
        border-radius: var(--murasaki-radius-md);
        border: 1px solid var(--murasaki-border);
      }
      .segment {
        padding: 5px 12px;
        font-size: 13px;
        color: var(--murasaki-ink-2);
        background: transparent;
        border: none;
        border-radius: var(--murasaki-radius-sm);
        cursor: pointer;
        transition: background 120ms, color 120ms, box-shadow 120ms;
      }
      .segment:hover {
        color: var(--murasaki-ink);
      }
      .segment.active {
        background: var(--murasaki-background);
        color: var(--murasaki-ink);
        box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      }
      .segment:focus-visible {
        outline: 2px solid var(--murasaki-ring);
        outline-offset: 1px;
      }

      /* === Number Stepper === */
      .number-stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--murasaki-border);
        border-radius: var(--murasaki-radius-md);
        overflow: hidden;
        background: var(--murasaki-background);
      }
      .stepper-btn {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: var(--murasaki-surface);
        color: var(--murasaki-ink-2);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        transition: background 120ms, color 120ms;
      }
      .stepper-btn:hover {
        background: var(--murasaki-neutral-200);
        color: var(--murasaki-ink);
      }
      .stepper-btn:active {
        background: var(--murasaki-neutral-300);
      }
      .stepper-input {
        width: 44px;
        height: 28px;
        border: none;
        border-left: 1px solid var(--murasaki-border);
        border-right: 1px solid var(--murasaki-border);
        text-align: center;
        font-size: 13px;
        color: var(--murasaki-ink);
        background: var(--murasaki-background);
        outline: none;
      }
      .stepper-input:focus {
        background: var(--murasaki-purple-50);
      }

      /* === Select === */
      .select-wrap {
        position: relative;
        display: inline-flex;
        align-items: center;
      }
      .setting-select {
        appearance: none;
        min-width: 150px;
        padding: 6px 28px 6px 10px;
        font-size: 13px;
        color: var(--murasaki-ink);
        background: var(--murasaki-background);
        border: 1px solid var(--murasaki-border);
        border-radius: var(--murasaki-radius-md);
        cursor: pointer;
        outline: none;
        transition: border-color 120ms, box-shadow 120ms;
      }
      .setting-select:hover {
        border-color: var(--murasaki-neutral-300);
      }
      .setting-select:focus-visible {
        border-color: var(--murasaki-ring);
        box-shadow: 0 0 0 2px var(--murasaki-ring);
      }
      .select-wrap svg {
        position: absolute;
        right: 10px;
        color: var(--murasaki-ink-3);
        transform: rotate(90deg);
        pointer-events: none;
      }

      /* === Footer === */
      .settings-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        gap: 12px;
        padding: 14px 32px;
        background: var(--murasaki-background);
        border-top: 1px solid var(--murasaki-line);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        padding: 0 16px;
        border-radius: var(--murasaki-radius-md);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 120ms, color 120ms, border-color 120ms, box-shadow 120ms;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: var(--murasaki-primary);
        color: var(--murasaki-primary-foreground);
      }
      .btn-primary:hover {
        background: var(--murasaki-purple-700);
      }
      .btn-primary:active {
        background: var(--murasaki-purple-800);
      }
      .btn-secondary {
        background: var(--murasaki-background);
        color: var(--murasaki-ink-2);
        border-color: var(--murasaki-border);
      }
      .btn-secondary:hover {
        background: var(--murasaki-muted);
        color: var(--murasaki-ink);
      }
      .btn-secondary:active {
        background: var(--murasaki-neutral-200);
      }
      .btn:focus-visible {
        box-shadow: 0 0 0 2px var(--murasaki-ring);
        outline: none;
      }

      /* Scrollbars */
      .content-inner::-webkit-scrollbar,
      #settings-sidebar::-webkit-scrollbar {
        width: 8px;
      }
      .content-inner::-webkit-scrollbar-track,
      #settings-sidebar::-webkit-scrollbar-track {
        background: transparent;
      }
      .content-inner::-webkit-scrollbar-thumb,
      #settings-sidebar::-webkit-scrollbar-thumb {
        background: var(--murasaki-neutral-300);
        border-radius: 4px;
      }
      .content-inner::-webkit-scrollbar-thumb:hover,
      #settings-sidebar::-webkit-scrollbar-thumb:hover {
        background: var(--murasaki-neutral-400);
      }
    </style>
</body>
</html>
